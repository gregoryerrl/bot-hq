name: release

# Builds bot-hq for macOS (universal .dmg), Linux (.AppImage + .deb), and
# Windows (NSIS .exe), then attaches the artifacts to a GitHub Release.
#
# Triggers:
#   - push a tag like `v0.1.0` -> builds + uploads to a DRAFT release for that tag
#   - manual (workflow_dispatch) -> validation build; artifacts uploaded to the
#     run (NOT a release) so the pipeline can be exercised before the first tag
#
# Builds are UNSIGNED for now. macOS users right-click -> Open (or run
# `xattr -dr com.apple.quarantine /Applications/bot-hq.app`); Windows users
# click "More info -> Run anyway" past SmartScreen. See docs/SIGNING.md to
# turn on real signing + notarization (just add the secrets + uncomment below).
#
# Flat layout note: tauri.conf.json + Cargo.toml live at the repo ROOT; the
# React frontend lives in frontend/. The Tauri CLI is a frontend devDependency
# and is invoked from the repo root, where it discovers the config.
#
# SUPPLY CHAIN (1.0.5): the build job — which runs `npm ci` lifecycle
# scripts, `build.rs` and the Tauri bundler over the dependency tree — holds a
# READ-ONLY token; only the small release job that attaches the finished
# bundles holds `contents: write`. Every action is pinned to a commit sha
# (the `# vX.Y.Z` beside each is the tag the sha was resolved from; bump both
# together). `dtolnay/rust-toolchain` normally takes the toolchain from its
# ref name, so the pinned form names it explicitly.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: one universal (arm64 + x86_64) .dmg for the Homebrew cask.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Linux: AppImage (primary, universal) + .deb. ubuntu-22.04 for the
          # older glibc -> widest AppImage compatibility.
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          # Windows: NSIS .exe installer. Platform plumbing is in (PID lock
          # via OpenProcess, ctrl-handler child reaper, Git-for-Windows hook
          # rendering); what Windows lacks is live runtime mileage — see
          # docs/WINDOWS-TESTING.md. The mcp-token ACL gap went with the
          # external driver's token (2026-08-17): no token, no gap.
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash # so ./frontend/node_modules/.bin/tauri runs on Windows too

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux bundling dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            build-essential

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build bundles
        # `tauri build` runs the frontend build (beforeBuildCommand), then
        # cargo build --release, then bundles. Run from repo root so the CLI
        # discovers tauri.conf.json.
        run: ./frontend/node_modules/.bin/tauri build ${{ matrix.args }}
        env:
          # The footer's build stamp: the commit this bundle was built from.
          BOTHQ_BUILD_COMMIT: ${{ github.sha }}
          # To enable macOS signing + notarization, add these repo secrets and
          # uncomment (see docs/SIGNING.md):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Always uploaded to the run: a manual run stops here (validation
      # build); a tag push hands them to the release job below.
      - name: Upload bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bot-hq-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every platform's bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bot-hq-*
          path: bundles
          merge-multiple: true

      # upload-artifact roots each artifact at the least common ancestor of
      # its PATTERNS (`target/`), not of the files it found — so after the
      # merge the bundles sit at bundles/universal-apple-darwin/release/bundle/
      # dmg/*.dmg and bundles/release/bundle/{deb,appimage,nsis}/*. The globs
      # recurse for that reason, and an empty match FAILS the job: the 1.0.5
      # run (34034086331) attached nothing while reporting success.
      - name: Attach artifacts to the draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          # Any semver pre-release tag (v1.0.0-rc1, -beta.1, -alpha, …) carries a
          # hyphen; a final vX.Y.Z does not. Auto-flag the former as a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: bot-hq ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            bundles/**/*.dmg
            bundles/**/*.deb
            bundles/**/*.AppImage
            bundles/**/*.exe
