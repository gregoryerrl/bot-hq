# Test jobs — the gap both platform handoffs named: no CI ran `cargo test`
# on ANY platform through 1.0.0, which is how 41 Windows lib failures and a
# never-compiled screenshot cfg-arm shipped unseen.
#
# ORDER NOTE (do not "align" with the local five-gate order): locally the
# release build runs LAST so it embeds a fresh frontend/dist; here the
# frontend build runs FIRST because `cargo test` cannot even compile without
# `frontend/dist` present (tauri::generate_context! embeds it). Different
# constraint, different order — both are correct where they run.
#
# Scope is `cargo test` + the frontend suite ONLY. No clippy/-D warnings:
# this repo has never had a lint gate, and adding one here would be an
# unbounded cleanup disguised as a CI line.
#
# SUPPLY CHAIN (1.0.5): this workflow runs whatever a PR ships — `npm ci`
# lifecycle scripts, `build.rs`, test code — so its token is read-only and
# every action is pinned to a commit sha (the `# vX.Y.Z` beside each is the
# tag that sha was resolved from; bump both together). `dtolnay/rust-toolchain`
# normally takes the toolchain from its ref name, so the pinned form names it
# explicitly. To re-pin: `git ls-remote --tags https://github.com/<o>/<r> 'vX.Y.Z*'`
# — the trailing glob matters, an exact tag name hides the `^{}` line — and
# take the PEELED (`^{}`) sha for an annotated tag (rust-cache is one), since
# Actions needs the commit, not the tag object.
name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "CHANGELOG.md"
      - "README.md"
      - "PRIVACY.md"
      - "SECURITY.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "CHANGELOG.md"
      - "README.md"
      - "PRIVACY.md"
      - "SECURITY.md"

permissions:
  contents: read

# A newer push to the same ref supersedes the run in flight — macOS minutes
# bill at 10x on a private repo, and a superseded run proves nothing.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Linux webkit/gtk dev packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            build-essential
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend deps + dist (cargo test needs frontend/dist)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Backend tests
        run: cargo test
      - name: Frontend tests + typecheck
        working-directory: frontend
        run: |
          npx vitest run
          npx tsc --noEmit

  windows:
    runs-on: windows-latest
    # REQUIRED since 1.0.5. It was advisory (continue-on-error) from 1.0.1
    # because every main run named the same failures: five ConPTY-bound
    # terminal tests (ConPTY never delivers EOF, so the PTY death path cannot
    # fire — deferred, CHANGELOG) and two tray tests racing a 20 ms sleep.
    # The five are now `#[cfg_attr(windows, ignore = …)]` by name and the
    # races are fixed, and run 34031587722 (841ffbf) was the first green
    # Windows suite on main — so a red here is real again.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend deps + dist
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Full Windows suite (PowerShell, fail-closed)
        shell: pwsh
        run: .\scripts\test-windows.ps1
      - name: Frontend tests + typecheck
        working-directory: frontend
        run: |
          npx vitest run
          npx tsc --noEmit
